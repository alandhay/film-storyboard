[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runway-gateway"
version = "0.1.0"
description = "Domain-agnostic gateway over the Runway generative media API."
readme = "README.md"
requires-python = ">=3.11"
# runwayml is the ONLY runtime dependency (per project ground rules). Everything
# else is stdlib. The gateway machinery (cache/retry/budget) added in Phase 2
# stays stdlib-only.
dependencies = ["runwayml>=5,<6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/runway_gateway"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
